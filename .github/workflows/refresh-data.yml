name: Refresh ISM web data

# Rebuilds web/data/ism.json (the ISM index backbones) and web/data/decomp.json
# (the supply/demand decomposition scopes) from the latest public sources and
# commits them, which triggers an automatic Vercel redeploy.
#
# CALENDAR-GATED, NOT MONTHLY
# ---------------------------
# This used to be a single cron on the 3rd of the month, which is the worst
# available day: US CPI is the only gauge that publishes before the 15th, and
# every other source lands between the 10th and the 25th of the following
# month. A run on the 3rd therefore fetched a vintage that was already ~5 weeks
# stale and missed the release that had happened ~10 days earlier.
#
# Instead the job now polls four times a day and asks config/release_calendar.yaml
# what SHOULD be public, compares it against what is actually committed in
# web/data/*.json, and rebuilds only the gauges that are behind:
#
#     expected vintage > committed vintage  ->  refresh that gauge
#
# Two consequences worth knowing:
#   * On the ~25 days a month with no release the `plan` job resolves in well
#    under a minute and the `refresh` job is skipped entirely.
#   * Because "due" is a property of the DATA and not of the calendar day, the
#     job is self-healing. A source that is down, a release that slips, a cron
#     that GitHub drops under load — all just mean the gauge is still behind at
#     the next poll and gets retried, instead of waiting a month.
#
# Poll times: one cron slot per release at the official release time + 5
# minutes (both DST variants), plus four backstops that retry anything still
# due. Each poll only runs the cheap `plan` gate unless something is due.
# GitHub cron is always UTC and has no DST, which is why the calendar carries
# IANA timezones and resolves the actual instant in Python. Scheduled runs can
# be delayed by GitHub under load; the vintage gate makes that harmless.
#
# Sources by gauge:
#   US PCE/CPI   -> BEA_API_KEY, FRED_API_KEY, BLS_API_KEY
#   UK CPI       -> ONS bulk CSV (no key)
#   FR/DE HICP   -> Eurostat (no key); Germany decomp -> DESTATIS_API_TOKEN
#   Japan        -> ESTAT_API_ID
#   Canada       -> StatCan (no key). The chunk caches under data/raw/statcan
#                   are not committed; they live in the Actions cache (key per
#                   calendar year, so January does one full re-pull that picks
#                   up national-accounts revisions) and each run refetches only
#                   the open-ended recent chunks. Probed 2026-11-16: hosted
#                   runners reach www150.statcan.gc.ca fine.
#
# Before committing, the freshly-built JSON is validated (schema, no gauge
# dropped, dates current and not regressing, panels non-empty) by
# scripts/validate_web_data.py so a bad refresh can't go live.

on:
  schedule:
    # One slot per release, at the official release time + 5 minutes, in both
    # winter and summer time (GitHub cron is UTC with no DST; the wrong-season
    # slot is a cheap no-op — the calendar gate finds nothing due). Generated
    # from config/release_calendar.yaml; `release_calendar check` verifies every
    # CI gauge is caught. GitHub can start scheduled runs some minutes late
    # under load.
    - cron: "35 0 * * *"    # AU, AU monthly, AU HCE   11:30 Sydney (AEDT)
    - cron: "35 1 * * *"    #                          11:30 Sydney (AEST)
    - cron: "5 6 * * *"     # UK 07:00 London (BST); NO/SE HCE 08:00 (CEST)
    - cron: "50 6 * * *"    # FR flash 08:45 Paris (CEST)
    - cron: "5 7 * * *"     # UK (GMT); ES flash (CEST); NO/SE HCE (CET)
    - cron: "50 7 * * *"    # FR flash (CET)
    - cron: "5 8 * * *"     # ES flash 09:00 Madrid (CET)
    - cron: "5 9 * * *"     # Eurostat 11:00 Brussels (CEST): EA FR DE IT ES NO SE, EA/IT flash, EU HCE
    - cron: "5 10 * * *"    # Eurostat (CET)
    - cron: "5 12 * * *"    # DE flash 14:00 Berlin (CEST)
    - cron: "35 12 * * *"   # US CPI/PCE/PPI, Canada CPI/HCE 08:30 ET (EDT)
    - cron: "5 13 * * *"    # DE flash (CET)
    - cron: "35 13 * * *"   # US, Canada (EST)
    - cron: "50 21 * * *"   # NZ 10:45 Auckland (NZDT)
    - cron: "50 22 * * *"   # NZ (NZST)
    - cron: "35 23 * * *"   # Japan 08:30 JST
    # Backstops: retry anything still due when an API tier posts its data
    # after the press release (e-Stat, ONS bulk CSV, BLS flat files).
    - cron: "0 4 * * *"
    - cron: "0 11 * * *"
    - cron: "15 14 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      gauges:
        description: "Gauges to refresh (space-separated, e.g. 'pce uk'). Blank = whatever the calendar says is due."
        required: false
        default: ""
      ignore_calendar:
        description: "Refresh everything regardless of the calendar gate"
        type: boolean
        required: false
        default: false

permissions:
  contents: write              # allow committing the refreshed JSON

concurrency:
  # Never let two refreshes race to commit the same 27 MB of JSON.
  group: refresh-data
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # Cheap gate. No heavy deps — pyyaml only — so a no-op poll costs seconds.
  # ---------------------------------------------------------------------
  plan:
    runs-on: ubuntu-24.04
    outputs:
      any:    ${{ steps.gate.outputs.any }}
      ism:    ${{ steps.gate.outputs.ism }}
      decomp: ${{ steps.gate.outputs.decomp }}
      trim:   ${{ steps.gate.outputs.trim }}
      gauges: ${{ steps.gate.outputs.gauges }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install gate deps
        run: pip install --quiet pyyaml tzdata

      # tests/ is gitignored in this repo, so the invariants that keep the gate
      # honest live in the module itself and run here on every poll: date shapes
      # match each gauge's declared `expect:` block, the fallback can never fire
      # early, gauges sharing a calendar share its timing, nothing in web/data is
      # unowned, and the cron slots below actually catch every release same-day.
      # This is a hard gate — a miswired calendar must not go on to fetch data.
      - name: Self-check the release calendar
        run: PYTHONPATH=src python -m ism.release_calendar check

      - name: Freshness report
        run: PYTHONPATH=src python -m ism.release_calendar report || true

      - name: Decide what is due
        id: gate
        env:
          MANUAL_GAUGES: ${{ github.event.inputs.gauges }}
          IGNORE_CAL:    ${{ github.event.inputs.ignore_calendar }}
        run: |
          set -euo pipefail
          export PYTHONPATH=src
          # NOTE: --only takes ONE space-separated value, so it must stay
          # quoted. Building an unquoted ARGS string and splatting it word-splits
          # "pce jp" into two arguments and argparse rejects the second — which
          # would break every multi-gauge dispatch, including all of the ones the
          # website's refresh button sends.
          if [ "${IGNORE_CAL:-false}" = "true" ]; then
            echo "Calendar gate bypassed — refreshing every CI gauge."
            python -m ism.release_calendar due --github-output --all
          elif [ -n "${MANUAL_GAUGES:-}" ]; then
            echo "Manual gauge list: $MANUAL_GAUGES"
            python -m ism.release_calendar due --github-output --only "$MANUAL_GAUGES"
          else
            python -m ism.release_calendar due --github-output
          fi
          echo "--- gate decision ---"; cat "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  refresh:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install --quiet tzdata

      # Canada: restore the StatCan chunk caches, then refetch what a release
      # can change. Only when a Canadian gauge is due.
      - name: Cache year
        id: year
        if: contains(needs.plan.outputs.ism, 'ca') || contains(needs.plan.outputs.decomp, 'ca')
        run: echo "y=$(date -u +%Y)" >> "$GITHUB_OUTPUT"

      # Key = year + run, so every run saves its refreshed chunks; restore takes
      # the newest of the SAME year only, so the first Canadian run of a year
      # starts empty and re-pulls everything (national-accounts revisions).
      - name: Restore StatCan chunk cache
        if: contains(needs.plan.outputs.ism, 'ca') || contains(needs.plan.outputs.decomp, 'ca')
        uses: actions/cache@v5
        with:
          path: data/raw/statcan/chunks*
          key: statcan-${{ steps.year.outputs.y }}-${{ github.run_id }}
          restore-keys: |
            statcan-${{ steps.year.outputs.y }}-

      # StatCan intermittently answers runners with a Cloudflare bot challenge
      # (403). That must cost Canada one refresh, never the whole run: the
      # fetch is continue-on-error, the exporters then skip Canada and keep
      # its committed data, and the run is annotated below.
      - name: Fetch StatCan (Canada CPI)
        id: statcan_cpi
        if: contains(needs.plan.outputs.ism, 'ca')
        continue-on-error: true
        run: python scripts/fetch_statcan.py --only cpi --recent

      - name: Fetch StatCan (Canada quarterly HCE)
        id: statcan_hce
        if: contains(needs.plan.outputs.decomp, 'ca')
        continue-on-error: true
        run: python scripts/fetch_statcan.py --only hce --recent

      - name: Note a blocked StatCan fetch
        if: steps.statcan_cpi.outcome == 'failure' || steps.statcan_hce.outcome == 'failure'
        run: |
          echo "::warning title=StatCan unreachable::StatCan refused the runner (usually its Cloudflare bot challenge). Canada keeps its previously committed data; every other gauge refreshes as normal. If it persists, run 'python scripts/fetch_statcan.py && python scripts/export_web_data.py ca' locally."

      - name: Refreshing
        run: |
          echo "gauges due : ${{ needs.plan.outputs.gauges }}"
          echo "ism        : ${{ needs.plan.outputs.ism }}"
          echo "decomp     : ${{ needs.plan.outputs.decomp }}"
          echo "trim       : ${{ needs.plan.outputs.trim }}"

      # Only the due backbones are passed, so an unrelated source being down
      # cannot touch a gauge that was already current. The exporters seed from
      # the committed file and keep previous data for anything not rebuilt.
      - name: Rebuild ISM data (web/data/ism.json)
        if: needs.plan.outputs.ism != ''
        env:
          FRED_API_KEY:       ${{ secrets.FRED_API_KEY }}
          BEA_API_KEY:        ${{ secrets.BEA_API_KEY }}
          BLS_API_KEY:        ${{ secrets.BLS_API_KEY }}
          ESTAT_API_ID:       ${{ secrets.ESTAT_API_ID }}
          DESTATIS_API_TOKEN: ${{ secrets.DESTATIS_API_TOKEN }}
        run: python scripts/export_web_data.py ${{ needs.plan.outputs.ism }}

      - name: Rebuild decomposition data (web/data/decomp.json)
        if: needs.plan.outputs.decomp != ''
        env:
          FRED_API_KEY:       ${{ secrets.FRED_API_KEY }}
          BEA_API_KEY:        ${{ secrets.BEA_API_KEY }}
          BLS_API_KEY:        ${{ secrets.BLS_API_KEY }}
          ESTAT_API_ID:       ${{ secrets.ESTAT_API_ID }}
          DESTATIS_API_TOKEN: ${{ secrets.DESTATIS_API_TOKEN }}
        run: python scripts/export_decomp_data.py ${{ needs.plan.outputs.decomp }}

      - name: Rebuild trimmed-mean + CPI->PCE data (web/data/trim.json)
        # Also when only PPI is due: its series feed the CPI->PCE bridge,
        # which lives in this file.
        # Every ISM rebuild, not just US CPI/PCE: the trimmed-mean scopes for
        # the other countries are read from ism.json and would otherwise wait
        # for the next US release (Canada sat a month behind that way).
        if: needs.plan.outputs.ism != '' || needs.plan.outputs.trim != ''
        env:
          BLS_API_KEY:        ${{ secrets.BLS_API_KEY }}
        run: python scripts/export_trim_data.py

      # Validation gate on the freshly-built DATA: valid schema, no gauge
      # dropped, dates current and not moving backwards, panels non-empty. If
      # anything fails the job stops here and nothing is committed, so a broken
      # refresh can't reach the live site. (Engine-code parity — src/ism vs
      # web/*.js — is a separate CI concern: a data-only refresh never changes
      # engine code.)
      - name: Validate refreshed data
        run: python scripts/validate_web_data.py

      # Republish the calendar the website's freshness panel reads. This MUST
      # run after the exporters and after validation: it embeds the vintages
      # actually present in the committed JSON, so generating it earlier would
      # describe the data we are replacing. Its build stamp is also what the
      # page polls to notice that a refresh has gone live.
      - name: Republish the browser release calendar
        run: python scripts/export_release_calendar.py

      - name: Post-refresh freshness
        run: PYTHONPATH=src python -m ism.release_calendar report || true

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git status --porcelain web/data/ism.json web/data/decomp.json web/data/release_calendar.json web/data/trim.json | grep -q .; then
            git add web/data/ism.json web/data/decomp.json web/data/release_calendar.json web/data/trim.json
            git commit -m "data: refresh ${{ needs.plan.outputs.gauges }} ($(date -u +%Y-%m-%d))"
            # The 16:00 poll and a human push can collide on a 27 MB binary-ish
            # blob; rebase would try to merge it. Re-export is cheaper than a
            # conflict, so just retry the push once after fetching.
            git push || (git pull --rebase=false --strategy=ours --no-edit && git push)
            echo "Refreshed and pushed."
          else
            echo "No change in web/data — nothing to commit."
          fi

  # ---------------------------------------------------------------------
  # Daily housekeeping: the freshness report, and a nag when a published
  # release calendar is about to run out. (This job used to exist to warn that
  # the hand-refreshed Canadian gauges had gone stale; Canada is refreshed by
  # CI since 2026-11-16, and any gauge without a CI path still shows up in the
  # report as "local".)
  # ---------------------------------------------------------------------
  monitor-local-gauges:
    needs: plan
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install --quiet pyyaml tzdata
      - name: Freshness report (CI and local gauges)
        run: PYTHONPATH=src python -m ism.release_calendar report || true

      # Nags once a quarter when a published calendar is about to run out.
      - name: Warn when the published calendar is running out
        run: |
          PYTHONPATH=src python -m ism.release_calendar horizon || \
            echo "::warning title=Release calendar needs topping up::One or more gauges have under 90 days of published release dates left. See the MAINTENANCE note in config/release_calendar.yaml."
