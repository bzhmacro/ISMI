# =============================================================================
# sources.yaml  --  Data source registry for the ISM replication
# =============================================================================
# Every external series used to replicate Lansing & Shapiro (2026) is declared
# here, with: the provider, the exact identifier/URL, the access method, and the
# role it plays in the paper. The downloader (src/ism/datasources.py) reads this
# file, so updating a series ID or URL here is all that's needed to refresh the
# pipeline. Raw pulls are cached under data/raw/<provider>/ with a fetch-stamp
# JSON sidecar recording the URL, parameters, and UTC timestamp of download.
#
# NOTE ON ACCESS: This sandbox's network allowlist blocks BEA and FRED hosts, so
# the fetch step is intended to run in the user's own environment (where the API
# keys below work). The code is environment-agnostic; only network reachability
# differs.
# =============================================================================

meta:
  paper: "Lansing, K. J. & Shapiro, A. H. (2026). Measuring Inflation Shock Momentum. FRBSF WP 2026-10."
  doi: "https://doi.org/10.24148/wp2026-10"
  sample: {start: "1959-02", end: "2026-02"}   # category inflation starts 1959m2; residuals/index from 1969m1
  notes: >
    Category-level PCE data go back to Feb 1959. The first 120-month rolling
    AR(1) window is Feb 1959 -> Jan 1969, so the index begins 1969m1, matching
    the author's published ISM_public.xlsx.

# API keys are read from environment variables (see .env / .env.example).
# Never commit real keys; .env is gitignored.
keys:
  fred: {env: "FRED_API_KEY"}
  bea:  {env: "BEA_API_KEY"}
  bls:  {env: "BLS_API_KEY"}

# -----------------------------------------------------------------------------
# 1. CORE: category-level PCE price & expenditure (the heart of the ISM index)
# -----------------------------------------------------------------------------
# Paper, Section 2.1, fn 7: "data on the underlying detail of quantity, price,
# and expenditure components of the PCE index are available in Tables 2.4.3U,
# 2.4.4U and 2.4.5U from the 'Underlying Detail' page of the BEA's website.
# ... We use the fourth level of disaggregation ... 129 categories ... back to
# 1959."
pce_categories:
  provider: bea
  dataset: "NIUnderlyingDetail"
  method: "GetData"          # BEA API method
  frequency: "M"
  tables:
    price_index:
      table_name: "U20404"   # BEA Table 2.4.4U: Price Indexes for PCE by Type of Product (monthly)
      role: "pi_{i,t} source -> monthly category inflation"
    nominal_expenditure:
      table_name: "U20405"   # BEA Table 2.4.5U: PCE by Type of Product (monthly, $)
      role: "w_{i,t} source -> expenditure weights (Eqs. 6-7)"
    real_quantity:
      table_name: "U20403"   # BEA Table 2.4.3U (optional; not required for baseline)
      role: "optional / cross-check"
  selection:
    level: 4                 # fourth level of disaggregation
    expected_n_categories: 129
    # The 4th-level line set is derived programmatically from the BEA table
    # hierarchy (LineNumber / indentation). See pipeline.select_leaf_categories.
  bulk_fallback:
    # If the BEA API is unreachable, the same tables can be downloaded as a zip
    # of CSVs from the BEA "Underlying Detail" page. Record the exact file used.
    url: "https://apps.bea.gov/national/Release/ZIP/Underlying.zip"
    files: ["U20404-M.csv", "U20405-M.csv"]

# -----------------------------------------------------------------------------
# 1b. ALTERNATIVE BACKBONE: category-level CPI (BLS) -- the "CPI gauge"
# -----------------------------------------------------------------------------
# The ISM engine is price-gauge-agnostic, so the same momentum machinery can be
# run on the BLS Consumer Price Index instead of BEA PCE (see src/ism/cpi_pipeline.py
# and `ism index cpi`). The paper itself uses PCE; this is a portable extension.
#
#   * Prices: one NSA price index per CPI item stratum, series CUUR0000<item>
#     (CPI-U, US city average, not seasonally adjusted -- the right input for
#     month-over-month inflation, matching how the PCE pipeline treats the BEA
#     price index).
#   * Categories: config/cpi_categories.csv pins a NON-OVERLAPPING partition of
#     ~70 item strata (SE* codes) whose relative importances sum to 100%, i.e. a
#     complete tiling of the index -- the CPI analogue of PCE's 4th-level cut.
#   * Weights: the CPI has no monthly expenditure series, so we use the static
#     BLS December-2023 relative importance broadcast across months (the engine
#     renormalises each month). Documented simplification vs PCE's time-varying
#     monthly nominal shares.
cpi_categories:
  provider: bls
  dataset: "CU"                 # Consumer Price Index - All Urban Consumers
  method: "timeseries/data"     # BLS public API v2 (api.bls.gov); key optional (raises daily cap)
  frequency: "M"
  prices:
    series_pattern: "CUUR0000{item}"   # U=urban, R=NSA, 0000=US city average, {item}=SE stratum code
    seasonal: "NSA"
    role: "pi_{i,t} source -> monthly CPI item-stratum inflation"
  categories:
    file: "config/cpi_categories.csv"  # cols: key, SeriesCode, group, ri_weight, label
    n_categories: 70
    selection: >
      Greedy top-down cut of the BLS relative-importance tree: on each branch take
      the shallowest node that maps to a published CPI item-stratum (SE) series.
      Yields a complete, non-overlapping expenditure-class partition (RIs sum to 100%).
  weights:
    kind: "static_relative_importance"
    vintage: "2023-12"
    source: "BLS CPI Relative Importance tables (Dec 2023, CPI-U, US city average)"
    url: "https://www.bls.gov/cpi/tables/relative-importance/2023.xlsx"
    role: "w_{i,t} source -> static RI vector, broadcast across months, renormalised by the engine"
    note: >
      To use year-varying RI, replace the single ri_weight column with one column
      per year and broadcast the matching year's vector per month.
  headline_cpi:
    series_id: "CUUR0000SA0"    # All items, CPI-U, US city average, NSA
    role: "12-month CPI inflation overlay (CPI analogue of PCEPI / Figure 1)"
    transforms: ["yoy_pct"]
  history_note: >
    Most strata go back to the 1950s-60s; a few begin later (owners' equivalent
    rent from 1983, telephone/IT services from 1997-98). The engine treats a
    category as absent until it has a full 120-month window, so the CPI ISM has
    fewer categories early on -- exactly as the PCE pipeline handles late-born lines.
  publication_gaps: >
    BLS occasionally fails to publish a month (e.g. the Oct-2025 CPI release was
    not produced). A single interior hole would break the month-over-month
    inflation chain, so cpi_pipeline interpolates interior gaps in the price index
    (limit_area="inside", never fabricating a leading/trailing tail).
  bulk_fallback:
    # If the API daily cap is hit, the full price history is in the BLS flat files.
    url: "https://download.bls.gov/pub/time.series/cu/"
    files:
      - "cu.data.1.AllItems"
      - "cu.data.11.USFoodBeverage"   # ... through cu.data.18.USOtherGoodsAndServices (major groups)
    item_titles: "https://download.bls.gov/pub/time.series/cu/cu.item"
    note: "Send a descriptive User-Agent; keep only periods M01-M12 (M13 is the annual average); value '-' means not available."


# -----------------------------------------------------------------------------
# 1c. TRIMMED-MEAN / MEDIAN MODEL: seasonally adjusted CPI, versioned weights,
#     and the two Reserve Banks' published measures
# -----------------------------------------------------------------------------
# The limited-influence estimators (src/ism/trim_engine.py) need three things the
# ISM backbone did not: SEASONALLY ADJUSTED category prices, TIME-VARYING CPI
# weights, and the published series to validate against. None of them needs a key.
#
# NOTE ON ACCESS: download.bls.gov returns HTTP 403 to the default
# `python-requests` user-agent. The module-level USER_AGENT in datasources.py
# (a name plus a contact URL, which is what BLS asks for) is accepted. Do not
# "simplify" it away.
cpi_seasonally_adjusted:
  provider: bls_flat
  method: "flat file"
  base: "https://download.bls.gov/pub/time.series/cu/"
  files: ["cu.data.1.AllItems", "cu.data.2.Summaries", "cu.data.11.USFoodBeverage",
          "cu.data.12.USHousing", "cu.data.13.USApparel", "cu.data.14.USTransportation",
          "cu.data.15.USMedical", "cu.data.16.USRecreation",
          "cu.data.17.USEducationAndCommunication", "cu.data.18.USOtherGoodsAndServices",
          "cu.data.20.USCommoditiesServicesSpecial"]
  series: "CUSR0000<item> (seasonally adjusted), falling back to CUUR0000<item>"
  role: "the cross-section the trimmed mean is taken of"
  notes: >
    BLS publishes a CUSR series only where the seasonal is statistically
    significant; for the rest the NSA index IS the adjusted index by their own
    test. Seven of the seventy pinned strata fall back this way, and
    BlsFlatFileClient.seasonally_adjusted reports which.
  regional_oer:
    series: ["CUUR0100SEHC", "CUUR0200SEHC", "CUUR0300SEHC", "CUUR0400SEHC"]
    files: ["cu.data.7.OtherNorthEast", "cu.data.8.OtherNorthCentral",
            "cu.data.9.OtherSouth", "cu.data.10.OtherWest"]
    role: >
      Owners' equivalent rent by census region -- the split that takes the median
      CPI replication from corr 0.965 to 0.997. No SA variant is published.

cpi_relative_importance:
  provider: bls
  method: "published tables"
  base: "https://www.bls.gov/cpi/tables/relative-importance/"
  files:
    modern: "<year>.xlsx           # 2020- , 'Indent Level' + 'Item and Group'"
    archive: ["ri-archive-1990-1999.zip", "ri-archive-2000-2009.zip",
              "ri-archive-2010-2019.zip"]   # fixed-width text, one file per year
  first_usable_year: 1997    # the 1998 CPI item-structure revision; see DECISIONS
  role: "December cost weights -> the anchors for the versioned monthly weights"
  pinned_to: "config/cpi_ri_by_year.csv, config/cleveland_ri_by_year.csv"
  rebuild: "python scripts/build_cpi_ri.py"

chained_cpi:
  provider: bls_flat
  method: "flat file"
  base: "https://download.bls.gov/pub/time.series/su/"
  files: ["su.data.1.AllItems"]
  series: "SUUR0000SA0"      # C-CPI-U, all items, US city average, NSA, from Dec-1999
  role: "the textbook formula-effect proxy in the CPI->PCE page (diagnostic only)"

cleveland_fed_measures:
  provider: frbcle
  method: "published flat files"
  urls:
    history: "https://www.clevelandfed.org/-/media/files/webcharts/mediancpi/usinflationdata.zip"
    components: "https://www.clevelandfed.org/-/media/files/webcharts/mediancpi/mediancpi_component_table.csv"
  role: "ground truth for the median CPI and the 16% trimmed-mean CPI"
  notes: >
    The "usinflationdata.csv" URL actually serves the ZIP, so the client asks for
    the ZIP by name and sniffs the magic bytes. The file carries both the
    "Revised" (Dec-82=100, current methodology, from 1983) and "Original"
    (Jan-67=100) vintages; validation uses the revised span only.

ppi_bridge_inputs:
  provider: bls_flat
  method: "flat file"
  base: "https://download.bls.gov/pub/time.series/pc/"
  role: >
    The producer prices BEA actually uses for the fifth of PCE that is not
    priced from the CPI. They are published about two weeks before the PCE, so
    on CPI day they are already known -- which is what makes the CPI->PCE
    nowcast possible. Adding them cuts the core PCE one-month error by 21% and
    the medical-services group error by 57%.
  pinned_to: "config/ppi_bridge_series.csv"
  seasonal: >
    The PPI-by-industry flat files carry ONLY unadjusted series. They are
    deseasonalised in ism.ppi with trailing month effects (no future data).
  notes: >
    The database splits across ~80 files with no rule mapping a series id to
    one of them, so the config names the file alongside each series id rather
    than have the client download the whole database to find seven series.

dallas_fed_trimmed_mean:
  provider: frbdal
  method: "published workbooks"
  urls:
    history: "https://www.dallasfed.org/-/media/documents/research/pce/pcehist.xlsx"
    detail: "https://www.dallasfed.org/-/media/documents/research/pce/detail.xlsx"
    technical_note: "https://www.dallasfed.org/-/media/Documents/research/pce/tech.pdf"
  trim: {lower: 0.24, upper: 0.31}
  role: "ground truth for the trimmed mean PCE; detail.xlsx gives the month's cross-section"

bank_of_canada_core_measures:
  provider: statcan
  method: "whole-table CSV (zipped)"
  urls:
    table: "https://www150.statcan.gc.ca/n1/tbl/csv/18100256-eng.zip"
    definitions: "https://www.bankofcanada.ca/rates/indicators/key-variables/key-inflation-indicators-and-the-target-range/"
  table_id: "18-10-0256-01"
  trim: {lower: 0.20, upper: 0.20}     # CPI-trim; CPI-median is the 50th percentile
  role: "ground truth for the Canada scope: CPI-trim and CPI-median"
  notes: >
    Both measures are taken on the MONTHLY cross-section, as ours are, so this is
    a real replication target rather than an overlay. Two differences the scores
    carry: the Bank's inputs are adjusted for changes in indirect taxes and
    seasonally adjusted with StatCan's own per-series specifications, and since
    the January 2024 reference month the published year-over-year figures are
    computed from index values rounded to one decimal. The table carries both the
    y/y rates and the 1989-01=100 indexes, so the 1-month horizon is derivable.

bank_of_japan_core_indicators:
  provider: boj
  method: "published workbook"
  urls:
    data: "https://www.boj.or.jp/en/research/research_data/cpi/cpirev.xlsx"
    page: "https://www.boj.or.jp/en/research/research_data/cpi/index.htm"
    method_note: "https://www.boj.or.jp/en/research/wps_rev/rev_2015/data/rev15e06.pdf"
  trim: {lower: 0.10, upper: 0.10}
  role: "overlay for the Japan scope: 10% trimmed mean, weighted median, mode"
  notes: >
    NOT a replication target. The Bank trims the cross-section of TWELVE-MONTH
    price changes (BoJ Review 2015-E-6, Chart 4) while this engine trims the
    monthly one and chains; the Bank also strips "institutional factors"
    (consumption-tax changes, free-education policies, the 2021 mobile-phone
    cuts, travel subsidies, energy-cost relief) that the official CPI we trim
    still contains. Every measure is estimated separately on each CPI base
    (2000, 2005, 2010, 2015, 2020, 2025) and spliced newest-base-first. The Bank
    publishes year-over-year rates only, so there is no 1-month line.

euro_area_trimmed_means:
  provider: ecb
  method: "SDMX REST"
  urls:
    example: "https://data-api.ecb.europa.eu/service/data/ICP/M.U2.N.TRIM30.3.ANR"
  role: "NOT USED -- recorded so the next person does not go looking"
  notes: >
    The ECB publishes trimmed means for the euro area only (ICP item codes
    TRIM05..TRIM50, where the number is the TOTAL trim: TRIM20 is 10% from each
    tail), under institution code 3, not 4. There is no per-country series, so
    they cannot validate the France or Germany scopes. As of 2026-09 the last
    observation is 2025-12 -- the same month Eurostat froze the ECOICOP v1
    datasets (see src/ism/eurostat.py), which is the likely reason.

# -----------------------------------------------------------------------------
# 2. Headline aggregate PCE (Figure 1 overlay; forecast target & control)
# -----------------------------------------------------------------------------
headline_pce:
  provider: fred
  series_id: "PCEPI"          # PCE price index, monthly, index 2017=100
  role: "12-month & 3-month PCE inflation (target + control)"
  transforms: ["yoy_pct", "3m_annualized_pct"]

# -----------------------------------------------------------------------------
# 3. Control / predictor variables (Table 1 controls; LP controls; Eq. 9 / 15)
# -----------------------------------------------------------------------------
controls:
  inflation_expectations_1y:
    provider: fred
    series_id: "MICH"         # Univ. of Michigan: expected 1-yr-ahead inflation, % (from 1978m1)
    role: "1-year ahead household inflation expectations"
    proxy_before_1978: "trailing 12-month PCE inflation (paper fn 14; corr 0.89)"

  unemployment_rate:
    provider: fred
    series_id: "UNRATE"       # civilian unemployment rate, % (the 'U' in V/U)
    role: "denominator of V/U ratio"

  vacancies_modern:
    provider: fred
    series_id: "JTSJOL"       # JOLTS job openings, level (2000m12+); the 'V' in V/U, modern era
    role: "numerator of V/U ratio (modern)"

  vacancies_historical:
    provider: external
    source: "Barnichon (2010), Composite Help-Wanted Index"
    url: "https://sites.google.com/site/regisbarnichon/data"
    role: "vacancy series spliced (print + online HWI) for pre-2000 history (paper fn 15)"
    note: "Download HWI_index.txt; splice to JOLTS to build the long V/U ratio."

  oil_price_wti:
    provider: fred
    series_id: "WTISPLC"      # Spot Crude Oil Price: WTI, monthly avg, $/bbl (from 1946m1)
    role: "monthly average WTI spot price per barrel"

  sp500:
    provider: external        # FRED SP500 is licensed to only ~10 yrs; need long history
    source: "Robert Shiller, Online Data (US Stock Markets 1871-present)"
    url: "http://www.econ.yale.edu/~shiller/data/ie_data.xls"
    role: "monthly average S&P 500 stock price index (level)"
    note: "Use the 'P' (S&P comp price) column, monthly. Alternative: Nasdaq Data Link / multpl."

  real_disposable_income:
    provider: fred
    series_id: "DSPIC96"      # Real Disposable Personal Income, chained 2017$, monthly
    role: "12-month growth rate of real personal disposable income"
    transforms: ["yoy_pct"]

  treasury_10y:
    provider: fred
    series_id: "GS10"         # 10-Year Treasury constant maturity, % (monthly)
    role: "long leg of yield-curve spread"

  fed_funds_rate:
    provider: fred
    series_id: "FEDFUNDS"     # Effective federal funds rate, % (monthly avg)
    role: "short leg of yield-curve spread"
    # spread = GS10 - FEDFUNDS

  nber_recession:
    provider: fred
    series_id: "USREC"        # NBER recession indicator, monthly {0,1}
    role: "recession dummy"

# -----------------------------------------------------------------------------
# 4. External identified shocks (Section 5 validation, Eq. 15)
# -----------------------------------------------------------------------------
external_shocks:
  romer_romer_disinflation:
    provider: manual
    source: "Romer & Romer (2024), Lessons from history for successful disinflation, JME 148."
    role: "attempted-disinflation impulse dates (Eq. 15, Fig. 3a)"
    # Dates are stated in the paper text (Section 5.1); encoded in config/shocks.yaml.
    dates:
      low_commitment:   ["1974-04", "1978-08"]
      medium_high:      ["1979-10", "1981-05", "1988-12", "2022-09"]   # baseline shock set

  kanzig_oil_supply_news:
    provider: external
    source: "Kanzig (2021), The Macroeconomic Effects of Oil Supply News, AER 111(4)."
    url: "https://www.diegokaenzig.com/research"   # replication files: OilSupplyNewsShock series
    role: "oil supply news shock (Eq. 15, Fig. 3b)"
    note: "Monthly OPEC-announcement high-frequency surprise series."

# -----------------------------------------------------------------------------
# 5. Ground truth (for convergence checks)
# -----------------------------------------------------------------------------
ground_truth:
  author_ism:
    provider: manual
    file: "data/raw/ISM_public_author.xlsx"
    source: "Provided directly by the paper's authors."
    columns: ["time_month", "ISM Index", "Positive Momentum Component", "Negative Momentum Component"]
    role: "validate computed ISM / S+ / S- (1969m1 -> 2026m2)"

# -----------------------------------------------------------------------------
# 6. External files expected on disk (drop-in; loaders read these exact paths)
# -----------------------------------------------------------------------------
external_files:
  shiller_sp500:
    path: "data/raw/external/ie_data.xls"
    auto_download: true
    url: "http://www.econ.yale.edu/~shiller/data/ie_data.xls"
    loader: "ism.external_data.load_shiller_sp500"
  barnichon_hwi:
    path: "data/raw/external/barnichon_hwi.csv"   # 2 cols: date, index
    auto_download: false
    url: "https://sites.google.com/site/regisbarnichon/data"
    loader: "ism.external_data.load_barnichon_hwi"
  kanzig_oil_shock:
    path: "data/raw/external/kanzig_oilshock.csv" # 2 cols: date, shock
    auto_download: false
    url: "https://www.diegokaenzig.com/research"
    loader: "ism.external_data.load_kanzig_oil_shock"
